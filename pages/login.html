
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | StudentHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header>
        <h1>Student Login</h1>
        <p>Welcome Back to StudentHub</p>
    </header>

    <nav aria-label="Main navigation">
        <a href="../index.html">Home</a>
        <a href="about.html">About</a>
        <a href="register.html">Register</a>
        <a href="login.html" aria-current="page">Login</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="events.html">Events</a>
        <a href="profile.html">Profile</a>
        <a href="contact.html">Contact</a>
        <a href="faq.html">FAQ</a>
        <a href="feedback.html">Feedback</a>
    </nav>

    <main id="main-content">
        <p class="breadcrumb"><a href="../index.html">Home</a> / Login</p>

        <section>
            <h2>Login to Your Account</h2>
            <form action="#" method="post">
                <div>
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email"
                           autocomplete="email" required>
                </div>

                <div>
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           autocomplete="current-password" required>
                </div>

                <button type="submit">Login</button>
            </form>

            <p>New to StudentHub? <a href="register.html">Create an account</a>.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 StudentHub. All rights reserved.</p>
    </footer>
</body>
</html>
